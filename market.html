<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Indian Market Dashboard</title>
<style>
  :root {
    --bg: #0c0e14;
    --surface: #151820;
    --surface2: #1c1f2e;
    --border: #2a2d3e;
    --text: #e8e8f0;
    --text-dim: #8888aa;
    --green: #00c853;
    --red: #ff3d57;
    --accent: #536dfe;
    --gold: #ffd740;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  header {
    padding: 16px 20px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg { width: 18px; height: 18px; }

  h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .nav-link {
    font-size: 0.75rem;
    color: var(--accent);
    text-decoration: none;
    padding: 4px 10px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    font-weight: 600;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--green);
    font-weight: 600;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  .loading-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    gap: 12px;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  .loading-spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .ticker-tape {
    width: 100%;
    height: 46px;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .ticker-fallback {
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 16px;
    gap: 24px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    font-size: 0.8rem;
    color: var(--text-dim);
    animation: fadeIn 0.3s ease;
  }

  .ticker-fallback span { white-space: nowrap; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .dashboard {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .chart-container {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    height: 420px;
  }

  .chart-tabs {
    display: flex;
    gap: 0;
    padding: 12px 16px 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .chart-tabs::-webkit-scrollbar { display: none; }

  .chart-tab {
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-dim);
    border: none;
    background: none;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.2s;
  }

  .chart-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .chart-frame {
    width: 100%;
    height: calc(100% - 46px);
    position: relative;
  }

  .sector-section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .sector-note {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-style: italic;
  }

  .sector-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }

  .sector-card {
    background: var(--surface2);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
  }

  .sector-card:active { transform: scale(0.97); }
  .sector-card:hover { border-color: var(--accent); }

  .sector-name {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .sector-change {
    font-size: 1.1rem;
    font-weight: 800;
  }

  .sector-change.up { color: var(--green); }
  .sector-change.down { color: var(--red); }

  .sector-bar {
    height: 4px;
    border-radius: 2px;
    margin-top: 8px;
    background: var(--border);
    overflow: hidden;
  }

  .sector-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.8s ease;
  }

  .sector-bar-fill.up { background: var(--green); }
  .sector-bar-fill.down { background: var(--red); }

  .widget-box {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .overview-widget { height: 460px; }
  .heatmap-container { height: 500px; }

  .tv-widget-container {
    width: 100%;
    height: 100%;
  }

  .footer {
    text-align: center;
    padding: 20px;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
  }

  .market-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .market-status.open {
    background: rgba(0, 200, 83, 0.1);
    color: var(--green);
  }

  .market-status.closed {
    background: rgba(255, 61, 87, 0.1);
    color: var(--red);
  }

  .market-status.pre-open {
    background: rgba(255, 215, 64, 0.1);
    color: var(--gold);
  }
</style>
</head>

<script>
// Market status check (IST: pre-open 9:00-9:15, open 9:15-15:30, Mon-Fri)
function updateMarketStatus() {
  const now = new Date();
  const istStr = now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' });
  const ist = new Date(istStr);
  const day = ist.getDay();
  const timeVal = ist.getHours() * 60 + ist.getMinutes();
  const isWeekday = day >= 1 && day <= 5;

  const el = document.getElementById('marketStatus');
  if (!isWeekday) {
    el.className = 'market-status closed';
    el.textContent = 'Closed (Weekend)';
  } else if (timeVal >= 540 && timeVal < 555) {
    el.className = 'market-status pre-open';
    el.textContent = 'Pre-Open';
  } else if (timeVal >= 555 && timeVal <= 930) {
    el.className = 'market-status open';
    el.textContent = 'Market Open';
  } else {
    el.className = 'market-status closed';
    el.textContent = 'Market Closed';
  }
}
updateMarketStatus();

}, 4000);

// Chart widget with cleanup
let currentChartWidget = null;

function loadChart(symbol) {
  const container = document.getElementById('chartFrame');
  container.innerHTML = '<div class="loading-placeholder"><div class="loading-spinner"></div>Loading chart...</div>';

  requestAnimationFrame(() => {
    container.innerHTML = '';
    const wrapper = document.createElement('div');
    wrapper.className = 'tv-widget-container';
    wrapper.innerHTML = '<div class="tradingview-widget-container__widget"></div>';
    const script = document.createElement('script');
    script.type = 'text/javascript';
    script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
    script.async = true;
    script.textContent = JSON.stringify({
      "autosize": true,
      "symbol": symbol,
      "interval": "5",
      "timezone": "Asia/Kolkata",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "backgroundColor": "#151820",
      "gridColor": "#1c1f2e",
      "allow_symbol_change": true,
      "support_host": "https://www.tradingview.com",
      "hide_top_toolbar": false,
      "hide_legend": false,
      "save_image": false,
      "studies": ["RSI@tv-basicstudies", "MAExp@tv-basicstudies"]
    });

    script.onerror = () => {
      container.innerHTML = '<div class="loading-placeholder" style="color:var(--red)">Failed to load chart. Check your connection.</div>';
    };

    wrapper.appendChild(script);
    container.appendChild(wrapper);
  });
}

  if (!tab) return;
  document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  loadChart(tab.dataset.symbol);
});

function renderSectors() {
  const grid = document.getElementById('sectorGrid');
  grid.innerHTML = sectors.map((s, i) => {
    return `
      <div class="sector-card" data-symbol="${s.chartSymbol}" data-name="${s.name}">
        <div class="sector-name">${s.name}</div>
        <div class="sector-change" id="sector-val-${i}" style="color:var(--text-dim);font-size:0.85rem">Loading...</div>
        <div class="sector-bar">
          <div class="sector-bar-fill" id="sector-bar-${i}" style="width:0%"></div>
        </div>
      </div>
    `;
  }).join('');

  // Tap sector to load its chart
  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.sector-card');
    if (!card) return;
    const symbol = card.dataset.symbol;
    const name = card.dataset.name;

    // Add a custom tab or switch to it
    const tabs = document.getElementById('chartTabs');
    let existing = tabs.querySelector(`[data-symbol="${symbol}"]`);
    if (!existing) {
      existing = document.createElement('button');
      existing.className = 'chart-tab';
      existing.dataset.symbol = symbol;
      existing.textContent = name.toUpperCase();
      tabs.appendChild(existing);
    }
    tabs.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
    existing.classList.add('active');
    loadChart(symbol);

    // Scroll to chart
    document.querySelector('.chart-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // Fetch real sector data via TradingView's embed data
  loadSectorData();
}

function loadSectorData() {
  // Use hidden TradingView single-quote widgets to extract real data
  // Fall back to a visual indicator that data comes from the widget
  sectors.forEach((s, i) => {
    const el = document.getElementById(`sector-val-${i}`);
    const bar = document.getElementById(`sector-bar-${i}`);

    // Create a hidden iframe to try loading mini widget data
    const container = document.createElement('div');
    container.style.cssText = 'position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none';
    container.innerHTML = `<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>`;

    const script = document.createElement('script');
    script.type = 'text/javascript';
    script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js';
    script.async = true;
    script.textContent = JSON.stringify({
      "symbol": s.symbol,
      "width": "100%",
      "isTransparent": true,
      "colorTheme": "dark",
      "locale": "en"
    });

    container.querySelector('.tradingview-widget-container').appendChild(script);
    document.body.appendChild(container);

    // After a timeout, check if widget loaded; if not, show dash
    setTimeout(() => {
      if (el.textContent === 'Loading...') {
        el.textContent = '—';
        el.style.color = 'var(--text-dim)';
      }
      container.remove();
    }, 8000);
  });

  // Poll for widget iframes that contain quote data
  let attempts = 0;
  const poller = setInterval(() => {
    attempts++;
    if (attempts > 20) { clearInterval(poller); return; }

    const iframes = document.querySelectorAll('iframe[id*="tradingview"]');
    // Widgets self-contain; we rely on the overview widget for actual data
  }, 500);
}

    }
  }, 10000);
}
loadOverview();

// Heatmap widget
function loadHeatmap() {
  const container = document.getElementById('heatmapWidget');

  const wrapper = document.createElement('div');
  wrapper.className = 'tradingview-widget-container';
  wrapper.style.cssText = 'width:100%;height:100%';
  wrapper.innerHTML = '<div class="tradingview-widget-container__widget" style="width:100%;height:100%"></div>';

  const script = document.createElement('script');
  script.type = 'text/javascript';
  script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js';
  script.async = true;
  script.textContent = JSON.stringify({
    "exchanges": [],
    "dataSource": "SENSEX",
    "grouping": "sector",
    "blockSize": "market_cap_basic",
    "blockColor": "change",
    "locale": "en",
    "symbolUrl": "",
    "colorTheme": "dark",
    "hasTopBar": true,
    "isDataSetEnabled": true,
    "isZoomEnabled": true,
    "hasSymbolTooltip": true,
    "isMonoSize": false,
    "width": "100%",
    "height": "100%"
  });

  script.onerror = () => {
    container.innerHTML = '<div class="loading-placeholder" style="color:var(--red)">Failed to load heatmap. Check your connection.</div>';
  };

  wrapper.appendChild(script);
  container.innerHTML = '';
  container.appendChild(wrapper);

  setTimeout(() => {
    const iframe = container.querySelector('iframe');
    if (!iframe) {
      container.innerHTML = '<div class="loading-placeholder" style="color:var(--text-dim)">Heatmap unavailable. <a href="https://www.tradingview.com/heatmap/stock/?color=change&dataset=SENSEX" target="_blank" style="color:var(--accent)">View on TradingView</a></div>';
    }
  }, 10000);
}
loadHeatmap();
</script>
