<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Indian Market Dashboard</title>
<style>
  :root {
    --bg: #0c0e14;
    --surface: #151820;
    --surface2: #1c1f2e;
    --border: #2a2d3e;
    --text: #e8e8f0;
    --text-dim: #8888aa;
    --green: #00c853;
    --red: #ff3d57;
    --accent: #536dfe;
    --gold: #ffd740;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  header {
    padding: 16px 20px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg { width: 18px; height: 18px; }

  h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .nav-link {
    font-size: 0.75rem;
    color: var(--accent);
    text-decoration: none;
    padding: 4px 10px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    font-weight: 600;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--green);
    font-weight: 600;
  }

  .live-dot {
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%; height: 100%; gap: 12px;
    color: var(--text-dim); font-size: 0.85rem;
  }

  .loading-spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .ticker-tape {
    width: 100%; height: 46px;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }

  .dashboard {
    padding: 16px;
    display: flex; flex-direction: column; gap: 16px;
    max-width: 1200px; margin: 0 auto;
  }

  .section-title {
    font-size: 0.8rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px;
  }

  .chart-container {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    height: 500px;
  }

  .chart-tabs {
    display: flex; gap: 0;
    padding: 12px 16px 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .chart-tabs::-webkit-scrollbar { display: none; }

  .chart-tab {
    padding: 8px 16px; font-size: 0.85rem; font-weight: 600;
    color: var(--text-dim); border: none; background: none;
    cursor: pointer; white-space: nowrap;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.2s;
  }

  .chart-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .chart-frame {
    width: 100%; height: calc(100% - 46px);
    position: relative;
  }

  .chart-frame iframe {
    width: 100%; height: 100%; border: none;
  }

  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }

  .section-note { font-size: 0.7rem; color: var(--text-dim); font-style: italic; }

  .stock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 10px;
  }

  .stock-card {
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
    height: 200px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .stock-card:active { transform: scale(0.98); }

  .widget-box {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .overview-widget { height: 460px; }
  .heatmap-container { height: 500px; }

  .footer {
    text-align: center; padding: 20px;
    font-size: 0.75rem; color: var(--text-dim);
  }

  .footer a { color: var(--accent); text-decoration: none; }

  .market-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px;
    font-size: 0.75rem; font-weight: 600;
  }

  .market-status.open { background: rgba(0,200,83,0.1); color: var(--green); }
  .market-status.closed { background: rgba(255,61,87,0.1); color: var(--red); }
  .market-status.pre-open { background: rgba(255,215,64,0.1); color: var(--gold); }
</style>
</head>
<body>

<header>

        {"proName": "BSE:SENSEX", "title": "SENSEX"},

        {"proName": "BSE:TCS", "title": "TCS"},
        {"proName": "BSE:HDFCBANK", "title": "HDFC BANK"},
        {"proName": "BSE:INFY", "title": "INFOSYS"},
        {"proName": "BSE:ICICIBANK", "title": "ICICI BANK"},
        {"proName": "BSE:SBIN", "title": "SBI"},
        {"proName": "BSE:BHARTIARTL", "title": "AIRTEL"},
        {"proName": "BSE:ITC", "title": "ITC"},
        {"proName": "BSE:TATAMOTORS", "title": "TATA MOTORS"},
        {"proName": "BSE:WIPRO", "title": "WIPRO"},
        {"proName": "BSE:AXISBANK", "title": "AXIS BANK"},
        {"proName": "BSE:ADANIENT", "title": "ADANI ENT"},
        {"proName": "BSE:LT", "title": "L&T"},
        {"proName": "BSE:KOTAKBANK", "title": "KOTAK BANK"}
      ],
      "showSymbolLogo": true,
      "isTransparent": true,
      "displayMode": "adaptive",

<div class="dashboard">

  <!-- Main Chart via TradingView iframe embed -->
  <div>
    <div class="section-title">Live Chart</div>
    <div class="chart-container">
      <div class="chart-tabs" id="chartTabs">
        <button class="chart-tab active" data-symbol="BSE:SENSEX">SENSEX</button>
        <button class="chart-tab" data-symbol="BSE:RELIANCE">RELIANCE</button>
        <button class="chart-tab" data-symbol="BSE:TCS">TCS</button>
        <button class="chart-tab" data-symbol="BSE:HDFCBANK">HDFC BANK</button>
        <button class="chart-tab" data-symbol="BSE:INFY">INFOSYS</button>
        <button class="chart-tab" data-symbol="BSE:SBIN">SBI</button>
        <button class="chart-tab" data-symbol="BSE:ICICIBANK">ICICI BANK</button>
      </div>
      <div class="chart-frame" id="chartFrame">
        <div class="loading-placeholder">
          <div class="loading-spinner"></div>
          Loading chart...
        </div>
      </div>
    </div>
  </div>

  <!-- Stock Cards with live mini charts -->
  <div>
    <div class="section-header">
      <div class="section-title" style="margin-bottom:0">Stocks</div>
      <div class="section-note">Tap to chart</div>
    </div>
    <div class="stock-grid" id="stockGrid"></div>
  </div>

  <!-- Market Overview -->
  <div>
    <div class="section-title">Market Overview</div>
    <div class="widget-box overview-widget" id="overviewWidget">
      <div class="loading-placeholder">
        <div class="loading-spinner"></div>
        Loading market data...
      </div>
    </div>
  </div>

  <!-- Heatmap -->
  <div>
    <div class="section-title">Market Heatmap</div>
    <div class="widget-box heatmap-container" id="heatmapWidget">
      <div class="loading-placeholder">
        <div class="loading-spinner"></div>
        Loading heatmap...
      </div>
    </div>
  </div>

  <div class="footer">
    Data provided by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a>. Not financial advice.<br>
    <a href="index.html">Magic 8-Ball</a>
  </div>
</div>

<script>
// Market status
function updateMarketStatus() {
  const ist = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
  const day = ist.getDay();
  const t = ist.getHours() * 60 + ist.getMinutes();
  const el = document.getElementById('marketStatus');
  if (day < 1 || day > 5) {
    el.className = 'market-status closed'; el.textContent = 'Closed (Weekend)';
  } else if (t >= 540 && t < 555) {
    el.className = 'market-status pre-open'; el.textContent = 'Pre-Open';
  } else if (t >= 555 && t <= 930) {
    el.className = 'market-status open'; el.textContent = 'Market Open';
  } else {
    el.className = 'market-status closed'; el.textContent = 'Market Closed';
  }
}
updateMarketStatus();
setInterval(updateMarketStatus, 30000);

// Chart — direct TradingView embed iframe (most reliable for all symbols)
function loadChart(symbol) {
  const container = document.getElementById('chartFrame');
  const encoded = encodeURIComponent(symbol);
  container.innerHTML = `<iframe
    src="https://s.tradingview.com/widgetembed/?hideideas=1&overrides=%7B%7D&enabled_features=%5B%5D&disabled_features=%5B%5D&locale=en#%7B%22symbol%22%3A%22${encoded}%22%2C%22frameElementId%22%3A%22tradingview_chart%22%2C%22interval%22%3A%22D%22%2C%22hide_top_toolbar%22%3A%220%22%2C%22hide_legend%22%3A%220%22%2C%22save_image%22%3A%220%22%2C%22studies%22%3A%5B%22RSI%40tv-basicstudies%22%5D%2C%22theme%22%3A%22dark%22%2C%22style%22%3A%221%22%2C%22timezone%22%3A%22Asia%2FKolkata%22%2C%22studies_overrides%22%3A%7B%7D%2C%22utm_source%22%3A%22%22%2C%22utm_medium%22%3A%22widget_new%22%2C%22utm_campaign%22%3A%22chart%22%2C%22utm_term%22%3A%22${encoded}%22%7D"
    style="width:100%;height:100%;border:none"
    allowtransparency="true"
    scrolling="no"
    allowfullscreen
  ></iframe>`;
}

document.getElementById('chartTabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.chart-tab');
  if (!tab) return;
  document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  loadChart(tab.dataset.symbol);
});

loadChart('BSE:SENSEX');

// Stock cards — dynamically create mini-symbol-overview widgets
// (innerHTML doesn't execute <script> tags, so we must use createElement)
const stocks = [
  { name: 'Reliance', symbol: 'BSE:RELIANCE' },
  { name: 'TCS', symbol: 'BSE:TCS' },
  { name: 'HDFC Bank', symbol: 'BSE:HDFCBANK' },
  { name: 'Infosys', symbol: 'BSE:INFY' },
  { name: 'ICICI Bank', symbol: 'BSE:ICICIBANK' },
  { name: 'SBI', symbol: 'BSE:SBIN' },
  { name: 'Airtel', symbol: 'BSE:BHARTIARTL' },
  { name: 'ITC', symbol: 'BSE:ITC' },
  { name: 'L&T', symbol: 'BSE:LT' },
  { name: 'Tata Motors', symbol: 'BSE:TATAMOTORS' },
  { name: 'Axis Bank', symbol: 'BSE:AXISBANK' },
  { name: 'Kotak Bank', symbol: 'BSE:KOTAKBANK' },
];

function createStockCard(stock) {
  const card = document.createElement('div');
  card.className = 'stock-card';
  card.dataset.symbol = stock.symbol;
  card.dataset.name = stock.name;

  const wrapper = document.createElement('div');
  wrapper.className = 'tradingview-widget-container';
  wrapper.style.cssText = 'width:100%;height:100%';

  const widgetDiv = document.createElement('div');
  widgetDiv.className = 'tradingview-widget-container__widget';
  wrapper.appendChild(widgetDiv);

  const script = document.createElement('script');
  script.type = 'text/javascript';
  script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js';
  script.async = true;
  script.textContent = JSON.stringify({
    "symbol": stock.symbol,
    "width": "100%",
    "height": "100%",
    "locale": "en",
    "dateRange": "1D",
    "colorTheme": "dark",
    "isTransparent": true,
    "autosize": true,
    "largeChartUrl": "",
    "noTimeScale": true,
    "chartOnly": false
  });

  wrapper.appendChild(script);
  card.appendChild(wrapper);
  return card;
}

function renderStockCards() {
  const grid = document.getElementById('stockGrid');
  stocks.forEach(stock => {
    grid.appendChild(createStockCard(stock));
  });

  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.stock-card');
    if (!card) return;
    const symbol = card.dataset.symbol;
    const name = card.dataset.name;

    const tabs = document.getElementById('chartTabs');
    let existing = tabs.querySelector(`[data-symbol="${symbol}"]`);
    if (!existing) {
      existing = document.createElement('button');
      existing.className = 'chart-tab';
      existing.dataset.symbol = symbol;
      existing.textContent = name.toUpperCase();
      tabs.appendChild(existing);
    }
    tabs.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
    existing.classList.add('active');
    loadChart(symbol);
    document.querySelector('.chart-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}
renderStockCards();

// Market Overview — uses createElement for script execution
function loadWidget(containerId, src, config) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  const wrapper = document.createElement('div');
  wrapper.className = 'tradingview-widget-container';
  wrapper.style.cssText = 'width:100%;height:100%';

  const widgetDiv = document.createElement('div');
  widgetDiv.className = 'tradingview-widget-container__widget';
  widgetDiv.style.cssText = 'width:100%;height:100%';
  wrapper.appendChild(widgetDiv);

  const script = document.createElement('script');
  script.type = 'text/javascript';
  script.src = src;
  script.async = true;
  script.textContent = JSON.stringify(config);

  script.onerror = () => {
    container.innerHTML = '<div class="loading-placeholder" style="color:var(--red)">Failed to load. Check your connection.</div>';
  };

  wrapper.appendChild(script);
  container.appendChild(wrapper);

  setTimeout(() => {
    if (!container.querySelector('iframe')) {
      container.innerHTML = '<div class="loading-placeholder" style="color:var(--text-dim)">Widget unavailable. <a href="https://www.tradingview.com/markets/stocks-india/" target="_blank" style="color:var(--accent)">View on TradingView</a></div>';
    }
  }, 12000);
}

loadWidget('overviewWidget',
  'https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js',
  {
    "width": "100%",
    "height": "100%",
    "symbolsGroups": [
      {
        "name": "Indices",
        "symbols": [
          { "name": "BSE:SENSEX", "displayName": "SENSEX" }
        ]
      },
      {
        "name": "Large Cap",
        "symbols": [
          { "name": "BSE:RELIANCE", "displayName": "Reliance" },
          { "name": "BSE:TCS", "displayName": "TCS" },
          { "name": "BSE:HDFCBANK", "displayName": "HDFC Bank" },
          { "name": "BSE:INFY", "displayName": "Infosys" },
          { "name": "BSE:ICICIBANK", "displayName": "ICICI Bank" },
          { "name": "BSE:BHARTIARTL", "displayName": "Bharti Airtel" },
          { "name": "BSE:SBIN", "displayName": "SBI" },
          { "name": "BSE:ITC", "displayName": "ITC" },
          { "name": "BSE:LT", "displayName": "L&T" },
          { "name": "BSE:TATAMOTORS", "displayName": "Tata Motors" }
        ]
      },
      {
        "name": "Banking",
        "symbols": [
          { "name": "BSE:HDFCBANK", "displayName": "HDFC Bank" },
          { "name": "BSE:ICICIBANK", "displayName": "ICICI Bank" },
          { "name": "BSE:SBIN", "displayName": "SBI" },
          { "name": "BSE:AXISBANK", "displayName": "Axis Bank" },
          { "name": "BSE:KOTAKBANK", "displayName": "Kotak Bank" }
        ]
      },
      {
        "name": "IT",
        "symbols": [
          { "name": "BSE:TCS", "displayName": "TCS" },
          { "name": "BSE:INFY", "displayName": "Infosys" },
          { "name": "BSE:WIPRO", "displayName": "Wipro" },
          { "name": "BSE:HCLTECH", "displayName": "HCL Tech" },
          { "name": "BSE:TECHM", "displayName": "Tech Mahindra" }
        ]
      }
    ],
    "showSymbolLogo": true,
    "isTransparent": true,
    "colorTheme": "dark",
    "locale": "en"
  }
);

loadWidget('heatmapWidget',
  'https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js',
  {
    "exchanges": [],
    "dataSource": "SENSEX",
    "grouping": "sector",
    "blockSize": "market_cap_basic",
    "blockColor": "change",
    "locale": "en",
    "symbolUrl": "",
    "colorTheme": "dark",
    "hasTopBar": true,
    "isDataSetEnabled": true,
    "isZoomEnabled": true,
    "hasSymbolTooltip": true,
    "isMonoSize": false,
    "width": "100%",
    "height": "100%"
  }
);
</script>

</body>
