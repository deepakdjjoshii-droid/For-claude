<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Indian Market Dashboard</title>
<style>
  :root {
    --bg: #0c0e14;
    --surface: #151820;
    --surface2: #1c1f2e;
    --border: #2a2d3e;
    --text: #e8e8f0;
    --text-dim: #8888aa;
    --green: #00c853;
    --red: #ff3d57;
    --accent: #536dfe;
    --gold: #ffd740;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  header {
    padding: 16px 20px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg { width: 18px; height: 18px; }

  h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .nav-link {
    font-size: 0.75rem;
    color: var(--accent);
    text-decoration: none;
    padding: 4px 10px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    font-weight: 600;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--green);
    font-weight: 600;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    gap: 12px;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  .loading-spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .ticker-tape {
    width: 100%;
    height: 46px;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }

  .dashboard {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .chart-container {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
    height: 500px;
  }

  .chart-tabs {
    display: flex;
    gap: 0;
    padding: 12px 16px 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .chart-tabs::-webkit-scrollbar { display: none; }

  .chart-tab {
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-dim);
    border: none;
    background: none;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.2s;
  }

  .chart-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .chart-frame {
    width: 100%;
    height: calc(100% - 46px);
    position: relative;
  }

  .sector-section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .sector-note {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-style: italic;
  }

  .sector-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 8px;
  }

  .sector-card {
    background: var(--surface2);
    border-radius: 10px;
    padding: 0;
    text-align: center;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
    overflow: hidden;
    height: 180px;
  }

  .sector-card:active { transform: scale(0.97); }

  .widget-box {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .overview-widget { height: 460px; }
  .heatmap-container { height: 500px; }

  .tv-widget-container {
    width: 100%;
    height: 100%;
  }

  .footer {
    text-align: center;
    padding: 20px;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
  }

  .market-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .market-status.open {
    background: rgba(0, 200, 83, 0.1);
    color: var(--green);
  }

  .market-status.closed {
    background: rgba(255, 61, 87, 0.1);
    color: var(--red);
  }

  .market-status.pre-open {
    background: rgba(255, 215, 64, 0.1);
    color: var(--gold);
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
        <polyline points="16 7 22 7 22 13"/>

  </div>
  <div class="header-right">

        {"proName": "BSE:TCS", "title": "TCS"},
        {"proName": "BSE:HDFCBANK", "title": "HDFC BANK"},
        {"proName": "BSE:INFY", "title": "INFOSYS"},
        {"proName": "BSE:ICICIBANK", "title": "ICICI BANK"},
        {"proName": "BSE:SBIN", "title": "SBI"},
        {"proName": "BSE:BHARTIARTL", "title": "AIRTEL"},
        {"proName": "BSE:ITC", "title": "ITC"},
        {"proName": "BSE:TATAMOTORS", "title": "TATA MOTORS"},
        {"proName": "BSE:WIPRO", "title": "WIPRO"},
        {"proName": "BSE:AXISBANK", "title": "AXIS BANK"},
        {"proName": "BSE:ADANIENT", "title": "ADANI ENT"},

<div class="dashboard">

  <!-- Main Chart — uses symbol-overview widget which reliably supports BSE symbols -->
  <div>
    <div class="section-title">Live Chart</div>
    <div class="chart-container">
      <div class="chart-tabs" id="chartTabs">
        <button class="chart-tab active" data-symbol="BSE:SENSEX">SENSEX</button>
        <button class="chart-tab" data-symbol="BSE:SENSEX50">SENSEX 50</button>

        <button class="chart-tab" data-symbol="BSE:HDFCBANK">HDFC BANK</button>

      </div>
      <div class="chart-frame" id="chartFrame">
        <div class="loading-placeholder">
          <div class="loading-spinner"></div>

        </div>
      </div>

  </div>

  <!-- Sector Performance — mini symbol overview widgets with real live data -->
  <div>
    <div class="sector-section-header">
      <div class="section-title" style="margin-bottom:0">Stocks</div>
      <div class="sector-note">Tap to chart</div>
    </div>

  </div>

  <!-- Market Overview Widget -->
  <div>
    <div class="section-title">Market Overview</div>
    <div class="widget-box overview-widget" id="overviewWidget">
      <div class="loading-placeholder">
        <div class="loading-spinner"></div>
        Loading market data...

  <!-- Heatmap -->
  <div>
    <div class="section-title">Market Heatmap</div>
    <div class="widget-box heatmap-container" id="heatmapWidget">
      <div class="loading-placeholder">
        <div class="loading-spinner"></div>
        Loading heatmap...

    </div>

  <div class="footer">
    Data provided by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a>. Not financial advice.<br>
    <a href="index.html">Magic 8-Ball</a>
  </div>
</div>

<script>
// Market status (IST: pre-open 9:00-9:15, open 9:15-15:30, Mon-Fri)
function updateMarketStatus() {
  const now = new Date();
  const istStr = now.toLocaleString('en-US', { timeZone: 'Asia/Kolkata' });
  const ist = new Date(istStr);
  const day = ist.getDay();
  const timeVal = ist.getHours() * 60 + ist.getMinutes();
  const isWeekday = day >= 1 && day <= 5;

  const el = document.getElementById('marketStatus');
  if (!isWeekday) {
    el.className = 'market-status closed';
    el.textContent = 'Closed (Weekend)';
  } else if (timeVal >= 540 && timeVal < 555) {
    el.className = 'market-status pre-open';
    el.textContent = 'Pre-Open';
  } else if (timeVal >= 555 && timeVal <= 930) {
    el.className = 'market-status open';
    el.textContent = 'Market Open';
  } else {
    el.className = 'market-status closed';
    el.textContent = 'Market Closed';
  }
}
updateMarketStatus();
setInterval(updateMarketStatus, 30000);

// Main chart — uses symbol-overview widget which works with BSE symbols
function loadChart(symbol) {
  const container = document.getElementById('chartFrame');
  container.innerHTML = '<div class="loading-placeholder"><div class="loading-spinner"></div>Loading chart...</div>';

  requestAnimationFrame(() => {
    container.innerHTML = '';
    const wrapper = document.createElement('div');
    wrapper.className = 'tv-widget-container';
    wrapper.innerHTML = '<div class="tradingview-widget-container__widget"></div>';

    const script = document.createElement('script');
    script.type = 'text/javascript';
    script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js';
    script.async = true;
    script.textContent = JSON.stringify({
      "symbols": [[symbol.split(':')[1] || symbol, symbol + "|1M"]],
      "chartOnly": false,
      "width": "100%",
      "height": "100%",
      "locale": "en",
      "colorTheme": "dark",
      "autosize": true,
      "showVolume": true,
      "showMA": true,
      "hideDateRanges": false,
      "hideMarketStatus": false,
      "hideSymbolLogo": false,
      "scalePosition": "right",
      "scaleMode": "Normal",
      "fontFamily": "-apple-system, BlinkMacSystemFont, sans-serif",
      "fontSize": "10",
      "noTimeScale": false,
      "valuesTracking": "1",
      "changeMode": "price-and-percent",
      "chartType": "area",
      "maLineColor": "#536dfe",
      "maLineWidth": 1,
      "maLength": 14,
      "backgroundColor": "#151820",
      "lineWidth": 2,
      "lineType": 0,
      "dateRanges": ["1d|5", "1m|1D", "3m|1D", "12m|1W", "60m|1W", "all|1M"]
    });

    script.onerror = () => {
      container.innerHTML = '<div class="loading-placeholder" style="color:var(--red)">Failed to load chart. Check your connection.</div>';
    };

    wrapper.appendChild(script);
    container.appendChild(wrapper);
  });
}

// Chart tabs
document.getElementById('chartTabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.chart-tab');
  if (!tab) return;
  document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  loadChart(tab.dataset.symbol);
});

loadChart('BSE:SENSEX');

// Stock cards — using mini symbol overview widgets for real live data
const stocks = [
  { name: 'Reliance', symbol: 'BSE:RELIANCE' },
  { name: 'TCS', symbol: 'BSE:TCS' },
  { name: 'HDFC Bank', symbol: 'BSE:HDFCBANK' },
  { name: 'Infosys', symbol: 'BSE:INFY' },
  { name: 'ICICI Bank', symbol: 'BSE:ICICIBANK' },
  { name: 'SBI', symbol: 'BSE:SBIN' },
  { name: 'Airtel', symbol: 'BSE:BHARTIARTL' },
  { name: 'ITC', symbol: 'BSE:ITC' },
  { name: 'L&T', symbol: 'BSE:LT' },
  { name: 'Tata Motors', symbol: 'BSE:TATAMOTORS' },
  { name: 'Axis Bank', symbol: 'BSE:AXISBANK' },
  { name: 'Kotak Bank', symbol: 'BSE:KOTAKBANK' },
];

function renderStockCards() {
  const grid = document.getElementById('sectorGrid');
  grid.innerHTML = stocks.map(s => {
    const id = 'stock-' + s.symbol.replace(/[^a-zA-Z]/g, '');
    return `
      <div class="sector-card" data-symbol="${s.symbol}" data-name="${s.name}" id="${id}">
        <div class="tradingview-widget-container" style="width:100%;height:100%">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
          {
            "symbol": "${s.symbol}",
            "width": "100%",
            "height": "100%",
            "locale": "en",
            "dateRange": "1D",
            "colorTheme": "dark",
            "isTransparent": true,
            "autosize": true,
            "largeChartUrl": "",
            "noTimeScale": true,
            "chartOnly": false
          }
          <\/script>
        </div>
      </div>
    `;
  }).join('');

  // Tap stock card to load its chart
  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.sector-card');
    if (!card) return;
    const symbol = card.dataset.symbol;
    const name = card.dataset.name;

    const tabs = document.getElementById('chartTabs');
    let existing = tabs.querySelector(`[data-symbol="${symbol}"]`);
    if (!existing) {
      existing = document.createElement('button');
      existing.className = 'chart-tab';
      existing.dataset.symbol = symbol;
      existing.textContent = name.toUpperCase();
      tabs.appendChild(existing);
    }
    tabs.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
    existing.classList.add('active');
    loadChart(symbol);
    document.querySelector('.chart-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}
renderStockCards();

// Heatmap widget
